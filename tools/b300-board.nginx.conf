location = /b300/board.json {
    if ($host != cc.zhifei.li) { return 404; }
    alias /srv/b300-board/board.json;
    default_type application/json;
    access_log off;
    etag off;
    if_modified_since off;
    add_header Access-Control-Allow-Origin "https://b300-board.github.io" always;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options "nosniff" always;
}
